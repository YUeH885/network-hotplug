[package]
name = "network-hotplug"
version = "0.1.0"
edition = "2024"
description = "State-based Linux network events dispatched to directory hooks"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
